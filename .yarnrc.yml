  - "@scaffold-ui/hooks"
  - burner-connector
  - rocketh
  - "@rocketh/core"
  - "@rocketh/node"
  - "@rocketh/deploy"
  - "@rocketh/signer"
  - "@rocketh/read-execute"
  - "@rocketh/verifier"

yarnPath: .yarn/releases/yarn-4.13.0.cjs
